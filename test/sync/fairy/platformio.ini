[env:nucleo_g071rb]
platform = ststm32
board = nucleo_g071rb
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink

build_flags =
    -Wall
    -Wextra
    -Wshadow

; the default command just doesn't work on the STM32 I don't know why
upload_command = openocd -f interface/stlink.cfg -f target/stm32g0x.cfg -c "program $SOURCE verify reset exit"

