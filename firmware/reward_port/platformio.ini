[platformio]
default_envs = final_pcb_g071gb

[env]
platform = ststm32
framework = stm32cube
board = nucleo_g071rb
; Stock ST script with the last flash page reserved for the node identity
; record (see ld/node_flash.ld). maximum_size matches so the size report and
; PlatformIO's overflow check use the smaller region.
board_build.ldscript = ld/node_flash.ld
board_upload.maximum_size = 129024
lib_deps = rig_protocol=symlink://../shared
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -Wno-unused-parameter
    -fno-exceptions
    -fno-rtti
upload_protocol = stlink
debug_tool = stlink
; OpenOCD config files are Tcl, where \b is backspace and \f is
; form feed.  $SOURCE on Windows is a path full of backslashes, so
; the braces are what stop Tcl mangling it.
; This firmware-only upload keeps the board's node number: `program` erases
; only the pages the image covers. To give a board its number, flash it with
; scripts/flash.py --id N instead.
upload_command = openocd -f interface/stlink.cfg -f target/stm32g0x.cfg -c "program {$SOURCE} verify reset exit"

[env:nucleo_g071rb_auto_rs485]
build_flags =
    ${env.build_flags}
    -DNODE_BOARD_PROFILE=1
    -DNODE_ENABLE_DEBUG_STREAM=1
    -DNODE_LIGHT_GATE_ALWAYS_ON=0

[env:final_pcb_g071gb]
; STM32G071GBU6 and STM32G071RBT6 use the same STM32G071 startup,
; flash size, peripherals, and Cortex M0+ core. This environment changes the
; package pin profile and disables the Nucleo debug UART.
build_flags =
    ${env.build_flags}
    -DNODE_BOARD_PROFILE=2
    -DNODE_ENABLE_DEBUG_STREAM=0
