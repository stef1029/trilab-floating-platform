[platformio]
default_envs = nucleo_g071rb_auto_rs485

[env]
platform = ststm32
framework = stm32cube
board = nucleo_g071rb
lib_deps = fairy_shared=symlink://../shared
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -Wno-unused-parameter
    -fno-exceptions
    -fno-rtti
upload_protocol = stlink
debug_tool = stlink
upload_command = openocd -f interface/stlink.cfg -f target/stm32g0x.cfg -c "program $SOURCE verify reset exit"

[env:nucleo_g071rb_auto_rs485]
build_flags =
    ${env.build_flags}
    -DFAIRY_BOARD_PROFILE=1
    -DFAIRY_ENABLE_DEBUG_STREAM=1
    -DFAIRY_LIGHT_GATE_ALWAYS_ON=0

[env:final_pcb_g071gb]
; STM32G071GBU6 and STM32G071RBT6 use the same STM32G071 startup,
; flash size, peripherals, and Cortex M0+ core. This environment changes the
; package pin profile and disables the Nucleo debug UART.
build_flags =
    ${env.build_flags}
    -DFAIRY_BOARD_PROFILE=2
    -DFAIRY_ENABLE_DEBUG_STREAM=0
