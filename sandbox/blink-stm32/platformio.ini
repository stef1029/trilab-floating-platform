; Sandbox blink for the NUCLEO-G071RB.
; Deliberately minimal -- compare against firmware/fairy/platformio.ini.

[env:nucleo_g071rb]
platform  = ststm32
framework = stm32cube
board     = nucleo_g071rb

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -g3                 ; debug info: zero flash cost, makes crashes readable
    -Wall
    -Wextra
    -fno-exceptions
    -fno-rtti

upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200
