; Sandbox "Node": receives real Transport v1 frames over USART1 and drives
; the Nucleo's user LED. Uses the SAME shared transport library as the real
; firmware, so the framing on the wire is genuinely Transport v1.

[env:nucleo_g071rb]
platform  = ststm32
framework = stm32cube
board     = nucleo_g071rb

lib_deps = rig_protocol=symlink://../../../firmware/shared

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -g3
    -Wall
    -Wextra
    -fno-exceptions
    -fno-rtti

upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200
