# ---- GPIO for the LED and button --------------------------------------
CONFIG_GPIO=y

# ---- Console over the DK's J-Link VCOM --------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# ---- Bluetooth --------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y                 # we accept connections, we don't scan
CONFIG_BT_DEVICE_NAME="sandbox-led"    # what the host searches for
CONFIG_BT_MAX_CONN=1

# GATT server: we expose a service with characteristics
CONFIG_BT_GATT_DYNAMIC_DB=n

# Let the host negotiate a bigger ATT MTU than the 23-byte default
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
