CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# The link to the Fairy: the ASYNC (DMA) UART API on uart1.
#
# Module 03 used the interrupt-driven API with a polled transmitter. That
# cannot work on RS485: uart_poll_out gives you no way to know when the last
# stop bit has actually left the wire, and dropping DE too early truncates
# the frame. The async API raises UART_TX_DONE at exactly that moment.
#
# These four lines are copied from firmware/korora/prj.conf.
CONFIG_UART_ASYNC_API=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n
CONFIG_UART_1_ASYNC=y
CONFIG_NRFX_TIMER=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="sandbox-bridge"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
