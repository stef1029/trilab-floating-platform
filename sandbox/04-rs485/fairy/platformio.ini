; Sandbox "Fairy", module 04: the same Transport v1 endpoint as module 03,
; but now behind an RS485 transceiver. PB3 drives DE//RE, as on the real
; Fairy PCB.

[env:nucleo_g071rb]
platform  = ststm32
framework = stm32cube
board     = nucleo_g071rb

lib_deps = fairy_shared=symlink://../../../firmware/shared

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -g3
    -Wall
    -Wextra
    -fno-exceptions
    -fno-rtti

upload_protocol = stlink
debug_tool      = stlink
monitor_speed   = 115200
